name = "Diskover (catalogue de fichiers)"
category = "homelab"
description = "Moteur de recherche de fichiers Diskover Community en local (http://localhost:8000) : catalogue du poste et du NAS, rescan hebdomadaire automatique le dimanche à 04:00."
vars = ["DISKOVER_PATHS"]
manual = true

[packages]
pacman = ["docker", "docker-compose", "git", "xdg-utils"]

[[files]]
src = "files/compose.yaml"
dst = "~/.local/opt/diskover-community/compose.yaml"
template = true

[[files]]
src = "files/diskover"
dst = "~/.local/bin/diskover"
mode = "755"
template = true

[[files]]
src = "files/scan-volumes.sh"
dst = "~/.local/share/diskover/config/scan-volumes.sh"
template = true

[[files]]
src = "files/finalize-unified.py"
dst = "~/.local/share/diskover/config/finalize-unified.py"

[[files]]
src = "files/diskover.desktop"
dst = "~/.local/share/applications/diskover.desktop"
template = true

[[files]]
src = "files/systemd/diskover-scan.service"
dst = "~/.config/systemd/user/diskover-scan.service"
template = true

[[files]]
src = "files/systemd/diskover-scan.timer"
dst = "~/.config/systemd/user/diskover-scan.timer"
