PACKAGE_NAME="xone"
PACKAGE_VERSION="0.5.8.1"
BUILT_MODULE_NAME[0]="xone_gip"
BUILT_MODULE_NAME[1]="xone_wired"
BUILT_MODULE_NAME[2]="xone_dongle"
BUILT_MODULE_NAME[3]="xone_gip_gamepad"
BUILT_MODULE_NAME[4]="xone_gip_headset"
BUILT_MODULE_NAME[5]="xone_gip_chatpad"
BUILT_MODULE_NAME[6]="xone_gip_madcatz_strat"
BUILT_MODULE_NAME[7]="xone_gip_madcatz_glam"
BUILT_MODULE_NAME[8]="xone_gip_pdp_jaguar"
DEST_MODULE_LOCATION[0]="/kernel/drivers/input/joystick"
DEST_MODULE_LOCATION[1]="/kernel/drivers/input/joystick"
DEST_MODULE_LOCATION[2]="/kernel/drivers/input/joystick"
DEST_MODULE_LOCATION[3]="/kernel/drivers/input/joystick"
DEST_MODULE_LOCATION[4]="/kernel/drivers/input/joystick"
DEST_MODULE_LOCATION[5]="/kernel/drivers/input/joystick"
DEST_MODULE_LOCATION[6]="/kernel/drivers/input/joystick"
DEST_MODULE_LOCATION[7]="/kernel/drivers/input/joystick"
DEST_MODULE_LOCATION[8]="/kernel/drivers/input/joystick"
AUTOINSTALL="yes"

# Match the compiler used by each installed kernel (CachyOS and CachyOS LTS differ).
xone_compiler_flags="LLVM= CC=gcc LD=ld"
if grep -q '^CONFIG_CC_IS_CLANG=y$' "/lib/modules/${kernelver}/build/.config"; then
    xone_compiler_flags="LLVM=1"
fi
MAKE[0]="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build ${xone_compiler_flags} -j4 modules"
