name = "OpenCode (Poe)"
category = "ai"
description = "Installe OpenCode, réservé aux modèles Poe, avec la config partagée du NAS (liens) ou une copie autonome sans NAS."
manual = true   # connexion : `opencode auth login` → Poe
# Variables optionnelles (profil [vars]) :
#   OPENCODE_SHARED_CONFIG  dossier partagé (ex. /mnt/nas/03_Shared/Config/Opencode) → liens symboliques
#                           (nécessite le module nas-mounts) ; absent → copie autonome du module
#   LLM_SERVER_URL          URL OpenAI-compatible du LLM local (copie autonome uniquement)
# Secret optionnel : POE_API_KEY dans ~/.config/fish/secrets.fish (voir README).

[[files]]
src = "files/opencode-path.fish"
dst = "~/.config/fish/conf.d/opencode.fish"

[[inputs]]
key = "OPENCODE_SHARED_CONFIG"
label = "Dossier de configuration partagé (facultatif)"
type = "path"
path_kind = "directory"
must_exist = true
help = "Laisser vide pour la configuration autonome. Un dossier privé synchronisé peut remplacer l’ancien partage NAS."

[[inputs]]
key = "LLM_SERVER_URL"
label = "Serveur LLM compatible OpenAI (facultatif)"
type = "text"
help = "Utilisé par la copie autonome ; laisser vide pour le serveur local par défaut."
