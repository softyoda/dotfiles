name = "Emplacements des applications KDE"
category = "kde"
description = "Ajoute au clic droit des applications les dossiers du programme et du raccourci, avec suivi des mises à jour sans modifier les fichiers système."

[packages]
pacman = ["python", "dolphin", "desktop-file-utils"]

[[files]]
src = "files/kde-app-locations"
dst = "~/.local/bin/kde-app-locations"
mode = "755"

[[parts]]
id = "auto-sync"
name = "Suivre les installations et mises à jour"
description = "Synchronise toutes les deux minutes et retire uniquement les copies générées devenues inutiles."
default = true
apply = "enable-sync.sh"
check = "check-sync.sh"

[[parts.files]]
src = "files/kde-app-locations.service"
dst = "~/.config/systemd/user/kde-app-locations.service"

[[parts.files]]
src = "files/kde-app-locations.timer"
dst = "~/.config/systemd/user/kde-app-locations.timer"
