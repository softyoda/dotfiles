name = "Emplacements des applications KDE"
category = "kde"
description = "Ajoute au clic droit des applications les dossiers du programme et du raccourci, avec suivi événementiel des raccourcis locaux."

[packages]
pacman = ["python", "dolphin", "desktop-file-utils"]

[[files]]
src = "files/kde-app-locations"
dst = "~/.local/bin/kde-app-locations"
mode = "755"

[[parts]]
id = "auto-sync"
name = "Suivre les changements des raccourcis locaux"
description = "Réagit aux changements des dossiers locaux, sans timer ni téléchargement, et retire les copies générées inutiles."
default = true
apply = "enable-sync.sh"
check = "check-sync.sh"

[[parts.files]]
src = "files/kde-app-locations.service"
dst = "~/.config/systemd/user/kde-app-locations.service"

[[parts.files]]
src = "files/kde-app-locations.path"
dst = "~/.config/systemd/user/kde-app-locations.path"
