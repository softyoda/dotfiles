# Options de montage udisks2 (>= 2.10) — module dotfiles « ntfs-automount ».
# Syntaxe : <signature>[:<pilote>]_<defaults|allow|drivers>=…  ($UID/$GID = utilisateur qui monte)
# Référence : https://storaged.org/udisks/docs/mount_options.html
# Les listes *_allow intégrées à udisks2 sont conservées (elles autorisent déjà uid, gid,
# windows_names…) : on ne change que les options par défaut.
[defaults]
# Pilotes essayés dans l'ordre : ntfs3 (noyau, rapide) puis « ntfs »
# (= ntfs-3g/FUSE via /usr/bin/mount.ntfs), utile si ntfs3 refuse le volume.
ntfs_drivers=ntfs3,ntfs

# ntfs3 (noyau) : fichiers à l'utilisateur, refus des noms interdits sous Windows
ntfs:ntfs3_defaults=uid=$UID,gid=$GID,windows_names

# ntfs-3g (FUSE) : mêmes règles
ntfs:ntfs_defaults=uid=$UID,gid=$GID,windows_names
