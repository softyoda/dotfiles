name = "Spotify + Spicetify"
category = "apps"
description = "Spotify natif via spotify-launcher, personnalisé par Spicetify avec le Marketplace."
[packages]
pacman = ["spotify-launcher", "kconfig"]

[[files]]
src = "files/spicetify-reapply"
dst = "~/.local/bin/spicetify-reapply"
mode = "755"

[[files]]
src = "files/spotify-with-spicetify"
dst = "~/.local/bin/spotify-with-spicetify"
mode = "755"

[[files]]
src = "files/marketplace-color.ini"
dst = "~/.config/spicetify/Themes/marketplace/color.ini"
