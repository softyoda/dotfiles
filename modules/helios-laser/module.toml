name = "Laser Helios DAC"
category = "creative"
description = "Pilotage d'un DAC laser Helios en USB depuis TouchDesigner : règle udev, bibliothèque SDK compilée, pont UDP vers USB en service utilisateur et scripts d'envoi côté TouchDesigner."
requires = ["touchdesigner"]

[packages]
pacman = ["libusb", "python"]

[[files]]
src = "files/99-helios-dac.rules"
dst = "/etc/udev/rules.d/99-helios-dac.rules"
root = true
mode = "644"

[[files]]
src = "files/helios_bridge.py"
dst = "~/.local/bin/helios_bridge.py"
mode = "755"

[[files]]
src = "files/helios-bridge.service"
dst = "~/.config/systemd/user/helios-bridge.service"
template = true

[[files]]
src = "files/helios_sender.py"
dst = "~/.local/share/touchdesigner-linux/helios_sender.py"

[[files]]
src = "files/helios_td_sender.py"
dst = "~/.local/share/touchdesigner-linux/helios_td_sender.py"
